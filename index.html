<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAHVØID</title>
<style>
  :root { color-scheme: dark; --ink: #d6d7da; --dim: #9a9ca2; --line: #b9bbc0; --card: #0b0b0c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: #131314;
    background-image:
      radial-gradient(circle at 20% 15%, #1d1d1f 0, transparent 45%),
      radial-gradient(circle at 80% 85%, #1a1a1c 0, transparent 50%);
    font-family: "Space Mono", "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    color: var(--ink);
    display: flex; align-items: center; justify-content: center;
    padding: 24px 16px;
  }
  .card {
    width: min(100%, 400px);
    background: var(--card);
    border: 1px solid #2a2a2d; border-radius: 10px;
    padding: 22px 22px 20px;
    box-shadow: 0 20px 60px #000a;
    text-transform: uppercase; letter-spacing: .2em;
  }
  .notch { --c: 14px; background: var(--line); padding: 1px;
    clip-path: polygon(var(--c) 0, calc(100% - var(--c)) 0, 100% var(--c), 100% calc(100% - var(--c)), calc(100% - var(--c)) 100%, var(--c) 100%, 0 calc(100% - var(--c)), 0 var(--c)); }
  .notch > div { background: var(--card);
    clip-path: polygon(var(--c) 0, calc(100% - var(--c)) 0, 100% var(--c), 100% calc(100% - var(--c)), calc(100% - var(--c)) 100%, var(--c) 100%, 0 calc(100% - var(--c)), 0 var(--c)); }
  .head > div { padding: 22px 20px 20px; }
  .head h1 { margin: 0 0 14px; font-size: 14px; font-weight: 400; letter-spacing: .26em; }
  .head p { margin: 0; font-size: 11px; line-height: 1.75; letter-spacing: .16em; }
  hr { border: 0; border-top: 1px solid #55565a; margin: 20px 4px; }
  .code-box { --c: 16px; margin: 4px 0 0; }
  .code-box > div { padding: 14px 10px 16px; text-align: center; }
  .code-label { font-size: 10px; letter-spacing: .3em; color: var(--dim); }
  .code { margin-top: 6px; font-size: clamp(26px, 9vw, 36px); letter-spacing: .22em; padding-left: .22em; color: #e9eaec; }
  .row { display: flex; gap: 18px; align-items: flex-start; margin: 16px 6px; }
  .row svg { flex: 0 0 28px; width: 28px; height: 28px; stroke: var(--ink); fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; margin-top: -2px; }
  .row .t { font-size: 16px; line-height: 1.35; letter-spacing: .2em; }
  .row .t small { display: block; font-size: 12px; color: var(--dim); }
  .steps .row { margin: 12px 6px; }
  .steps .t { font-size: 11px; letter-spacing: .17em; line-height: 1.6; }
  .steps .n { color: var(--dim); margin-right: 8px; }
  .foot { display: flex; justify-content: space-between; align-items: flex-end; margin: 18px 6px 0; font-size: 10px; line-height: 1.7; letter-spacing: .2em; color: var(--ink); }
  .foot .logo { font-size: 17px; letter-spacing: .24em; color: #cfd0d3; }
</style>
</head>
<body>
<main class="card">
  <section class="notch head"><div>
    <h1>You have a secret code.</h1>
    <p>Keep this card. Your code could unlock a free entry to our next event.</p>
  </div></section>

  <hr>

  <section class="notch code-box"><div>
    <div class="code-label">Your personal code</div>
    <div class="code" id="code">LHV-····</div>
  </div></section>

  <div class="row" style="margin-top:26px">
    <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M7.5 14h.01M12 14h.01M16.5 14h.01M7.5 17.5h.01M12 17.5h.01M16.5 17.5h.01"/></svg>
    <div class="t"><small>Next event:</small>27 February</div>
  </div>
  <div class="row">
    <svg viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
    <div class="t">Den Haag</div>
  </div>

  <hr>

  <div class="steps">
    <div class="row">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5h.01"/></svg>
      <div class="t"><span class="n">1.</span>Follow us on Instagram</div>
    </div>
    <div class="row">
      <svg viewBox="0 0 24 24"><path d="M21 3L3 10.5l7 3 3 7L21 3zM10 13.5L21 3"/></svg>
      <div class="t"><span class="n">2.</span>Send us your code in a DM</div>
    </div>
    <div class="row">
      <svg viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0V4zM8 6H4v1a4 4 0 0 0 4 4M16 6h4v1a4 4 0 0 1-4 4M12 13v4M8 21h8M10 17h4"/></svg>
      <div class="t"><span class="n">3.</span>The winning code will be announced in our stories</div>
    </div>
  </div>

  <div class="foot">
    <div>Stay tuned.<br>Stay connected.</div>
    <div class="logo">LAHVØID</div>
  </div>
</main>

<script>
  // Number of random digits in each code (LHV-0000 style). More digits = fewer duplicates.
  var DIGITS = 4;
  var KEY = "lahvoid_giveaway_code";

  function makeCode() {
    var buf = new Uint32Array(DIGITS), out = "";
    crypto.getRandomValues(buf);
    for (var i = 0; i < DIGITS; i++) out += (buf[i] % 10);
    return "LHV-" + out;
  }

  var code = null;
  try { code = localStorage.getItem(KEY); } catch (e) {}
  if (!code) {
    code = makeCode();
    try { localStorage.setItem(KEY, code); } catch (e) {}
  }
  document.getElementById("code").textContent = code;
</script>
</body>
</html>
